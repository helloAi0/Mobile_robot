name: CI
on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (plain Python, no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pyyaml numpy scipy matplotlib xacro mujoco trimesh pycollada
      - name: Fetch the official SDF schema (used to lint worlds and models)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/gazebosim/sdformat /tmp/sdformat
          git -C /tmp/sdformat sparse-checkout set sdf/1.9
      - run: python -m pytest -q mobile_robot_bringup/test
        env:
          SDFORMAT_SDF_DIR: /tmp/sdformat/sdf/1.9
      - name: Independent physics check (MuJoCo)
        run: python mobile_robot_description/tools/physics_check.py
      - name: Benchmark smoke test (3 runs, 60 s, pipeline only)
        run: python mobile_robot_bringup/tools/benchmark.py --backend sim2d --runs 3 --duration 60 --out /tmp/bench_smoke.json
      - name: C++ mux core vs the Python mux (golden vectors) and latency
        run: |
          python -m pytest -q mobile_robot_bringup/test/test_mux_cpp.py
          python mobile_robot_bringup/tools/mux_latency.py --iterations 5000

  ros-build:
    name: ROS 2 Jazzy build + launch files + integration (mock hardware)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with: { path: ws/src/mobile_robot }
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-ros2-control ros-jazzy-ros2-controllers \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher ros-jazzy-rviz2 ros-jazzy-slam-toolbox \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-ros2controlcli \
            ros-jazzy-robot-localization ros-jazzy-rosbag2 ros-jazzy-rosbag2-compression-zstd python3-scipy \
            python3-pytest python3-numpy python3-yaml python3-colcon-common-extensions
      - name: Build
        working-directory: ws
        run: . /opt/ros/jazzy/setup.sh && colcon build --symlink-install
      - name: Unit tests through colcon
        working-directory: ws
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test --packages-select mobile_robot_description mobile_robot_gazebo mobile_robot_bringup --event-handlers console_direct+ > /tmp/colcon_test.log 2>&1 || true
          if ! colcon test-result --verbose > /tmp/colcon_result.log 2>&1; then
            # surface the failure in the run's annotations (readable without downloading logs)
            (cd src/mobile_robot && python3 -m pytest -q -rs mobile_robot_bringup/test -p no:cacheprovider > /tmp/pytest_direct.log 2>&1 || true; python3 -m pytest --collect-only -q mobile_robot_bringup/test -p no:cacheprovider 2>&1 | tail -6 >> /tmp/pytest_direct.log; python3 --version >> /tmp/pytest_direct.log; pip list 2>/dev/null | grep -i -E "pytest|scipy|numpy|yaml" >> /tmp/pytest_direct.log)
            msg=$( (tail -45 /tmp/pytest_direct.log; grep -A6 "The following tests FAILED" /tmp/colcon_test.log; grep -E "^(FAILED|ERROR) |short test summary|passed|failed|ModuleNotFound|ImportError|rror:" /tmp/colcon_test.log | head -40) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=colcon test failed::${msg}"
            tail -40 /tmp/colcon_result.log
            exit 1
          fi
          cat /tmp/colcon_result.log | tail -5
      - name: Launch files load
        working-directory: ws
        run: |
          . /opt/ros/jazzy/setup.sh && . install/setup.sh
          for f in launch_sim autonomy hardware; do ros2 launch mobile_robot_bringup $f.launch.py --show-args > /dev/null; done
          ros2 launch mobile_robot_bringup replay.launch.py --show-args > /dev/null
          ls install/mobile_robot_bringup/lib/mobile_robot_bringup/cmd_vel_mux_node     # the C++ mux was built
      - name: Gazebo validates the robot and the worlds (URDF to SDF conversion, schema, physics parameters)
        working-directory: ws
        continue-on-error: true      # the walking people use remote Fuel meshes; remove this line once it has run green
        run: |
          . /opt/ros/jazzy/setup.sh && . install/setup.sh
          export GZ_SIM_RESOURCE_PATH=$PWD/install/mobile_robot_gazebo/share/mobile_robot_gazebo/models:$PWD/install
          xacro install/mobile_robot_description/share/mobile_robot_description/urdf/robot.urdf.xacro hardware:=mock \
            controllers:=/dev/null > /tmp/robot.urdf
          gz sdf -p /tmp/robot.urdf > /tmp/robot.sdf
          gz sdf -k /tmp/robot.sdf
          for w in install/mobile_robot_gazebo/share/mobile_robot_gazebo/worlds/*.sdf; do gz sdf -k "$w"; done
      - name: Integration test (mock hardware, no simulator)
        working-directory: ws
        continue-on-error: true      # remove this line once it has run green on your repository
        run: . /opt/ros/jazzy/setup.sh && . install/setup.sh && bash src/mobile_robot/mobile_robot_bringup/test/integration_mock.sh
